name: nethernet-desktop
arch: amd64
platform: linux
version: 1.0.0
section: net
priority: optional
maintainer: NotAlive24
description: "Desktop control suite for Bedrock Node Tunnel"
vendor: NotAlive24
homepage: https://github.com/NotAlive24/BedrockNodeTunnel
license: Apache-2.0
release: "1"

contents:
  - src: ./bin/NethernetDesktop
    dst: /usr/bin/NethernetDesktop
    file_info:
      mode: 0755
  - src: ./build/appicon.png
    dst: /usr/share/icons/hicolor/512x512/apps/nethernet-desktop.png
  - src: ./build/linux/NethernetDesktop.desktop
    dst: /usr/share/applications/nethernet-desktop.desktop

depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
