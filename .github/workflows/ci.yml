name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-cross-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate Linux installer syntax
        run: |
          bash -n install.sh
          bash -n install-desktop.sh

      - name: Validate desktop UI JavaScript
        run: node --check desktop/frontend/app.js

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Smoke-test release packaging
        run: go run ./tools/release -version 2.0.0 -out /tmp/bnt-release -targets deb,arch,windows

      - name: Cross-compile Linux and Windows
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bnt-cross-build
          for target in "linux amd64" "linux arm64" "windows amd64" "windows arm64"; do
            read -r goos goarch <<< "$target"
            suffix=""
            if [[ "$goos" == "windows" ]]; then suffix=".exe"; fi
            echo "Building $goos/$goarch"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 \
              go build -trimpath \
              -ldflags "-s -w -X main.version=ci" \
              -o "/tmp/bnt-cross-build/nethernet-client-$goos-$goarch$suffix" .
          done

      - name: Upload cross-platform binaries
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nethernet-client-cross-platform
          path: /tmp/bnt-cross-build/*
          if-no-files-found: error
          retention-days: 14
