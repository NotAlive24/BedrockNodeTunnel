name: Nethernet Desktop Native Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux AppImage, DEB and Arch package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: desktop/go.mod
      - name: Install Linux build and AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libfuse2t64 patchelf file wget curl
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Build native packages
        working-directory: desktop
        run: wails3 task linux:package
      - name: Verify package outputs
        working-directory: desktop
        run: |
          set -euo pipefail
          find bin -maxdepth 1 -type f -printf '%f\n'
          test -n "$(find bin -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find bin -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find bin -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-Linux-Packages
          path: desktop/bin/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: desktop/go.mod
      - name: Install NSIS
        run: choco install nsis -y
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Build Windows installer
        working-directory: desktop
        run: wails3 task windows:package
      - name: Verify installer
        shell: pwsh
        run: |
          if (!(Test-Path "desktop/bin/NethernetDesktop-installer.exe")) {
            throw "Expected NSIS installer was not created."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-Windows-Installer
          path: desktop/bin/NethernetDesktop-installer.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish native desktop packages
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Nethernet Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
