name: Nethernet Desktop Native Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-native-v*"

permissions:
  contents: write

jobs:
  linux:
    name: Linux DEB and Arch package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: desktop/go.mod
      - name: Resolve desktop dependencies
        working-directory: desktop
        run: go mod tidy
      - name: Test desktop
        working-directory: desktop
        run: go test ./...
      - name: Build Linux packages
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p bin build/linux
          go run ./tools/generate-icon
          go build -trimpath -ldflags="-s -w" -o bin/NethernetDesktop .
          cat > build/linux/NethernetDesktop.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Nethernet Desktop
          Comment=Local browser control suite for Bedrock Node Tunnel
          Exec=NethernetDesktop
          Icon=nethernet-desktop
          Terminal=false
          Categories=Network;Utility;
          StartupNotify=false
          EOF
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.1
          nfpm package --config build/linux/nfpm/nfpm.yaml --packager deb --target bin
          nfpm package --config build/linux/nfpm/nfpm.yaml --packager archlinux --target bin
          find bin -maxdepth 1 -type f -printf '%f\n'
          test -n "$(find bin -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find bin -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-Linux-Packages
          path: |
            desktop/bin/*.deb
            desktop/bin/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: desktop/go.mod
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "NSIS installation did not contain makensis.exe at $nsisPath"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath
      - name: Resolve desktop dependencies
        working-directory: desktop
        run: go mod tidy
      - name: Test desktop
        working-directory: desktop
        run: go test ./...
      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui" -o bin/NethernetDesktop.exe .
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop build failed" }
          & makensis -DARG_WAILS_AMD64_BINARY="$PWD\bin\NethernetDesktop.exe" build/windows/nsis/project.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }
          if (!(Test-Path "bin/NethernetDesktop-installer.exe")) {
            throw "Expected NSIS installer was not created."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-Windows-Installer
          path: desktop/bin/NethernetDesktop-installer.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish native desktop packages
    if: startsWith(github.ref, 'refs/tags/desktop-native-v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Nethernet Desktop Native ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
