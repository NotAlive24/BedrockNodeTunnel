name: Nethernet Desktop Native Packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux DEB and Arch packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: desktop/go.mod
      - name: Test desktop
        working-directory: desktop
        run: go test ./...
      - name: Build Linux packages
        working-directory: desktop
        run: |
          set -euo pipefail
          mkdir -p bin build/linux
          go run ./tools/generate-icon
          go build -trimpath -ldflags="-s -w -X main.desktopVersion=v2.0.0" -o bin/NethernetDesktop .
          cat > build/linux/NethernetDesktop.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Nethernet Desktop
          Comment=Local browser control suite for Bedrock Node Tunnel
          Exec=NethernetDesktop
          Icon=nethernet-desktop
          Terminal=false
          Categories=Network;Utility;
          StartupNotify=false
          EOF
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.44.1
          nfpm package --config build/linux/nfpm/nfpm.yaml --packager deb --target bin
          nfpm package --config build/linux/nfpm/nfpm.yaml --packager archlinux --target bin
          test -n "$(find bin -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find bin -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-Linux-Native-Packages
          path: |
            desktop/bin/*.deb
            desktop/bin/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows per-user NSIS installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: desktop/go.mod
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $nsisPath = "C:\Program Files (x86)\NSIS"
          if (!(Test-Path (Join-Path $nsisPath "makensis.exe"))) {
            throw "NSIS installation did not contain makensis.exe at $nsisPath"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisPath
      - name: Test desktop
        working-directory: desktop
        run: go test ./...
      - name: Build Windows installer
        working-directory: desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -trimpath -ldflags="-s -w -H windowsgui -X main.desktopVersion=v2.0.0" -o bin/NethernetDesktop.exe .
          if ($LASTEXITCODE -ne 0) { throw "Windows desktop build failed" }
          $desktopExe = (Resolve-Path "bin/NethernetDesktop.exe").Path
          Push-Location "build/windows/nsis"
          try {
            & makensis "-DARG_DESKTOP_BINARY=$desktopExe" "-DPRODUCT_VERSION=2.0.0" "project.nsi"
            if ($LASTEXITCODE -ne 0) { throw "NSIS installer build failed" }
          } finally {
            Pop-Location
          }
          if (!(Test-Path "bin/NethernetDesktop-installer.exe")) {
            throw "Expected NSIS installer was not created."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-Windows-Native-Installer
          path: desktop/bin/NethernetDesktop-installer.exe
          if-no-files-found: error
          retention-days: 14
