name: Nethernet Desktop Suite CI

on:
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: desktop/go.mod
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Resolve desktop dependencies and generate go.sum
        working-directory: desktop
        run: go mod tidy
      - working-directory: desktop
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Generate bindings
        working-directory: desktop
        run: wails3 generate bindings
      - working-directory: desktop
        run: go test ./...
      - working-directory: desktop
        run: go build -trimpath -o /tmp/nethernet-desktop .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: desktop/go.mod
      - name: Resolve desktop dependencies and generate go.sum
        working-directory: desktop
        run: go mod tidy
      - working-directory: desktop
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
      - name: Generate bindings
        working-directory: desktop
        run: wails3 generate bindings
      - working-directory: desktop
        run: go test ./...
      - working-directory: desktop
        run: go build -trimpath -o $env:TEMP/nethernet-desktop.exe .
