name: Nethernet Desktop Portable Builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            executable: NethernetDesktop
            engine: nethernet-client
            archive: tar.gz
          - platform: windows-x64
            os: windows-latest
            executable: NethernetDesktop.exe
            engine: nethernet-client.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.mod
      - name: Test CLI
        run: go test ./...
      - name: Test desktop
        working-directory: desktop
        run: go test ./...
      - name: Build portable desktop bundle
        shell: bash
        run: |
          set -euo pipefail
          version="2.0.0"
          mkdir -p stage
          (cd desktop && go build -trimpath -ldflags="-s -w -X main.desktopVersion=v${version}" -o "../stage/${{ matrix.executable }}" .)
          GOOS="${{ runner.os == 'Windows' && 'windows' || 'linux' }}" GOARCH=amd64 CGO_ENABLED=0             go build -trimpath -ldflags="-s -w -X main.version=v${version}"             -o "stage/${{ matrix.engine }}" .
          cat > stage/README.txt <<'EOF'
          Nethernet Desktop Control Suite 2.0.0

          This archive contains the browser UI launcher and matching
          Nethernet tunnel engine. Keep both files in the same directory.

          Start NethernetDesktop. It binds its HTTP server only to 127.0.0.1
          on an automatically selected local port and opens the UI in the
          system browser. It is not exposed to the LAN.

          A modern system browser is required. The app does not embed
          WebView2, GTK or WebKitGTK.
          EOF
      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -C stage -czf "Nethernet-Desktop-${{ matrix.platform }}.tar.gz" .
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "Nethernet-Desktop-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-${{ matrix.platform }}
          path: Nethernet-Desktop-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
