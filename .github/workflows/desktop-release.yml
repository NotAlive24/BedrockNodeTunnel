name: Nethernet Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-24.04
            executable: NethernetDesktop
            engine: nethernet-client
            archive: tar.gz
          - platform: windows-x64
            os: windows-latest
            executable: NethernetDesktop.exe
            engine: nethernet-client.exe
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.mod
      - name: Resolve desktop dependencies
        working-directory: desktop
        run: go mod tidy
      - name: Test CLI
        run: go test ./...
      - name: Test desktop
        working-directory: desktop
        run: go test ./...
      - name: Stage application and tunnel engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          (cd desktop && go build -trimpath -ldflags="-s -w" -o "../stage/${{ matrix.executable }}" .)
          go build -trimpath -ldflags="-s -w" -o "stage/${{ matrix.engine }}" .
          cat > stage/README.txt <<'EOF'
          Nethernet Desktop Control Suite

          This archive contains the local browser UI launcher and matching
          Nethernet tunnel engine. Keep both files in the same directory.

          Start NethernetDesktop. It binds its HTTP server exclusively to
          127.0.0.1 on an automatically selected local port and opens the UI
          in your default browser. The UI is not exposed to your LAN.

          The system browser is required. No WebView2, GTK or WebKitGTK runtime
          is required by the desktop control application.

          The app stores profiles and settings in the current user's
          configuration directory.
          EOF
      - name: Create Linux archive
        if: runner.os == 'Linux'
        run: tar -C stage -czf "Nethernet-Desktop-${{ matrix.platform }}.tar.gz" .
      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "Nethernet-Desktop-${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Nethernet-Desktop-${{ matrix.platform }}
          path: Nethernet-Desktop-${{ matrix.platform }}.${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish portable desktop release assets
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Nethernet Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
